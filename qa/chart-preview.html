<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family:
          -apple-system,
          Segoe UI,
          sans-serif;
        background: #f4f6fb;
        margin: 0;
        padding: 24px;
      }
      .row {
        display: flex;
        gap: 28px;
        align-items: center;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }
      .ring {
        position: relative;
        width: 126px;
        height: 126px;
      }
      .seg {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 13px solid transparent;
        box-sizing: border-box;
      }
      .center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .pct {
        font-size: 17px;
        font-weight: 900;
        color: #10b981;
      }
      .lbl {
        font-size: 9px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: #94a3b8;
      }
      .sub {
        font-size: 10.5px;
        font-weight: 700;
        color: #64748b;
      }
      .trend {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        height: 118px;
        margin-top: 18px;
      }
      .col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .barbg {
        width: 62%;
        height: 92px;
        border-radius: 6px;
        background: #eef2f8;
        display: flex;
        align-items: flex-end;
        overflow: hidden;
      }
      .bar {
        width: 100%;
        border-radius: 6px;
        background: #2874f0;
        opacity: 0.75;
      }
      h4 {
        margin: 0 0 10px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h4>Revenue · Daily</h4>
      <div class="row">
        <div class="ring" id="ring"></div>
        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 10.5px;
            color: #6b7280;
          "
        >
          <div>● Period total · <b style="color: #111827">₹7,450</b></div>
          <div>● Peak day · <b style="color: #111827">₹2,100</b></div>
          <div>● Avg / day · <b style="color: #111827">₹1,064</b></div>
        </div>
      </div>
      <div class="trend" id="trend"></div>
    </div>
    <script>
      // Same algorithm as AdminOverviewTab: up to 4 coloured quarter-arcs.
      function ring(pct, color, track) {
        let html = `<div class="seg" style="border-color:${track}"></div>`;
        [0.25, 0.5, 0.75, 1].forEach((stage, idx) => {
          if (pct <= 0 || pct < idx / 4) return;
          const filled = Math.min(1, (pct - idx / 4) / 0.25);
          const rot = filled >= 1 ? idx * 90 : idx * 90 - 90 * (1 - filled);
          html += `<div class="seg" style="border-top-color:${color};transform:rotate(${rot}deg)"></div>`;
        });
        html += `<div class="center"><div class="pct">${Math.round(pct * 100)}%</div>
             <div class="lbl">of period</div><div class="sub">₹1,250</div></div>`;
        return html;
      }
      document.getElementById("ring").innerHTML = ring(
        0.72,
        "#10b981",
        "#eef2f8",
      );

      const vals = [420, 980, 640, 1250, 2100, 810, 1250];
      const days = ["S", "M", "T", "W", "T", "F", "S"];
      const max = Math.max(...vals);
      document.getElementById("trend").innerHTML = vals
        .map(
          (v, i) => `<div class="col">
      <div class="barbg"><div class="bar" style="height:${Math.max(4, (v / max) * 88)}px;background:${i === vals.length - 1 ? "#10b981" : "#2874f0"};opacity:${i === vals.length - 1 ? 1 : 0.75}"></div></div>
      <div style="font-size:9.5px;font-weight:700;color:${i === vals.length - 1 ? "#10b981" : "#64748b"}">${days[i]}</div>
    </div>`,
        )
        .join("");
    </script>
  </body>
</html>
